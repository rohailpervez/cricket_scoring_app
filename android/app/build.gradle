plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"

    // Add Google services Gradle plugin
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.cricketscoringapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // ✅ ApplicationId same hona chahiye jo Firebase Console pe diya tha
        applicationId = "com.example.cricketscoringapp"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    //  Firebase BoM (Bill of Materials) - compatible versions manage karega
    implementation(platform("com.google.firebase:firebase-bom:34.1.0"))

    //  Firebase Analytics (aur bhi add kar sakte ho jaise Auth, Firestore, etc.)
    implementation("com.google.firebase:firebase-analytics")
}
